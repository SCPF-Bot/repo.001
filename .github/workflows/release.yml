name: Build Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Debug"]
    types:
      - completed

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK licenses and install Platform 37
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Print build and dependency versions
        run: |
          echo "=== Gradle / AGP / SDK ==="
          ./gradlew --version --no-daemon

          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties

          echo "=== libs.versions.toml ==="
          cat gradle/libs.versions.toml

          echo "=== app/build.gradle.kts ==="
          grep -n -E \
            "compileSdk|minSdk|targetSdk|namespace|applicationId" \
            app/build.gradle.kts

          echo "=== releaseRuntimeClasspath ==="
          ./gradlew :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --no-daemon

      - name: Diagnose AAR metadata
        run: |
          set -o pipefail
          ./gradlew :app:checkReleaseAarMetadata \
            --info \
            --stacktrace \
            --no-daemon \
            2>&1 | tee aar-metadata.log

          echo "--- grep for the exact incompatibility ---"
          grep -i -A 10 -B 2 -E \
            "AAR metadata|minCompileSdk|minAgpVersion|minSdkVersion|CheckAarMetadata" \
            aar-metadata.log || true

      - name: Generate ephemeral signing keystore
        run: |
          keytool -genkeypair \
            -keystore release-key.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storepass android \
            -keypass android \
            -dname "CN=CI Build, OU=Dev, O=MLBB Assistant, L=Unknown, S=Unknown, C=US"

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            --info \
            --stacktrace \
            --no-daemon \
            2>&1 | tee assemble-release.log

      - name: Align APK
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" \
            -print \
            -quit)

          if [[ -z "$APK" ]]; then
            echo "No release APK was produced" >&2
            exit 1
          fi

          echo "Aligning $APK"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" \
            -v 4 "$APK" app-release-aligned.apk

      - name: Sign APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias release \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release-signed.apk \
            app-release-aligned.apk

      - name: Verify signed APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify \
            --verbose app-release-signed.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-assistant-release
          path: app-release-signed.apk
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            aar-metadata.log
            assemble-release.log
          retention-days: 7
          if-no-files-found: warn