name: Android Release Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bundled JSON & portrait assets
        run: python3 scripts/validate_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (uses the committed wrapper, 9.3.1)
        uses: gradle/actions/setup-gradle@v4

      # Debug builds need no keystore: AGP signs them with its default debug key.
      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      # Release signing is opt-in. Without the secrets the release is built unsigned, so no
      # artifact is ever signed with a key whose password is public.
      - name: Load release signing key from secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$SECRET_STORE_PASSWORD" ] || [ -z "$SECRET_KEY_PASSWORD" ]; then
            echo "::notice::Release signing secrets are not set; the release APK/AAB will be UNSIGNED."
            exit 0
          fi
          # Kept under RUNNER_TEMP, outside the checkout, so it never lands in the workspace.
          KEYSTORE_FILE="$RUNNER_TEMP/upload-key.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK & AAB
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload test, lint & debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload release APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-and-aab
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
