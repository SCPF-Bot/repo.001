name: Build Release

on:
  workflow_dispatch:
  # Direct source pushes.
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/release.yml"
  # "Extract Archives" and "Update TTS Models" push their commits with
  # GITHUB_TOKEN (and possibly [skip ci]), which never fires `push` workflows,
  # so chain off their completion instead. The old trigger pointed at a
  # "Build Debug" workflow that does not exist in this repo.
  workflow_run:
    workflows: ["Extract Archives", "Update TTS Models"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache voice guide binaries
        uses: actions/cache@v4
        with:
          path: |
            app/libs
            app/tts-models-cache
          key: voice-guide-${{ hashFiles('gradle/libs.versions.toml', 'app/src/main/assets/tts/tts-models.json') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Android SDK components
        run: |
          set -uo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "build-tools;36.0.0" "platform-tools"

          # compileSdk 37: the SDK id is android-37 or android-37.0 depending on the
          # repository, so look it up instead of hard-coding it.
          PLATFORM=$("$SDKMANAGER" --list 2>/dev/null \
            | grep -oE 'platforms;android-37(\.[0-9]+)?' | sort -u | head -n1)
          if [[ -n "$PLATFORM" ]]; then
            echo "Installing $PLATFORM"
            "$SDKMANAGER" "$PLATFORM"
          else
            echo "No android-37 platform listed; AGP will download it (licenses are accepted)."
          fi

      - name: Print toolchain versions
        run: |
          ./gradlew --version
          grep -E '^(agp|kotlin|composeBom) ' gradle/libs.versions.toml
          grep -nE 'compileSdk|minSdk|targetSdk|namespace|applicationId' app/build.gradle.kts

      - name: Generate ephemeral signing keystore
        run: |
          keytool -genkeypair \
            -keystore release-key.jks \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storepass android \
            -keypass android \
            -dname "CN=CI Build, OU=Dev, O=MLBB Plus, L=Unknown, ST=Unknown, C=US"

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee assemble-release.log

      - name: Align APK
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          if [[ -z "$APK" ]]; then
            echo "No release APK was produced" >&2
            exit 1
          fi

          echo "Aligning $APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f -v 4 "$APK" app-release-aligned.apk

      - name: Sign APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias release \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-release-signed.apk \
            app-release-aligned.apk

      - name: Verify signed APK
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose app-release-signed.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-plus-release
          path: app-release-signed.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: assemble-release.log
          retention-days: 7
          if-no-files-found: ignore
