name: Android Release Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate bundled JSON & portrait assets
        run: python3 scripts/validate_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure ephemeral debug keystore on CI runner
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests, Lint, and Debug build
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Prepare release test signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASS="$SECRET_STORE_PASSWORD"
            KEY_PASS="$SECRET_KEY_PASSWORD"
          else
            STORE_PASS="mlbb-test-store"
            KEY_PASS="mlbb-test-store"
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$STORE_PASS" \
              -alias upload \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MLBB Plus Test,O=MLBB Plus,C=US"
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build Release APK & AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Clean up ephemeral keystores
        if: always()
        run: rm -f "${{ github.workspace }}/my-upload-key.jks" "${{ github.workspace }}/debug.keystore"

      - name: Upload test & debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload Release APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-and-aab
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
