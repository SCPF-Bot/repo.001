name: Update TTS Models

# Refreshes and verifies the TTS voice pack manifest. scripts/update_tts_models.py
# downloads each pinned archive into app/tts-models-cache/ (gitignored), checks every
# SHA-256 against the pins and against upstream checksum.txt, validates the pack layout,
# and regenerates app/src/main/assets/tts/tts-models.json, the manifest the app uses to
# download voice packs at runtime. The packs themselves are not in the APK.
#
# A commit pushed with GITHUB_TOKEN does not fire `push` workflows, so when the manifest
# changes this workflow dispatches the Release workflow explicitly (workflow_dispatch
# events are the exception that GITHUB_TOKEN may trigger).

on:
  workflow_dispatch:
  schedule:
    # Weekly drift check against the upstream tts-models release.
    - cron: "17 3 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-tts-models
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache voice pack archives
        uses: actions/cache@v4
        with:
          path: app/tts-models-cache
          key: tts-models-${{ hashFiles('scripts/update_tts_models.py') }}
          restore-keys: |
            tts-models-

      - name: Update and verify TTS model pins
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/update_tts_models.py 2>&1 | tee update-tts-models.log

      - name: Validate app assets
        run: python3 scripts/validate_assets.py

      - name: Commit refreshed manifest
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/tts/tts-models.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh TTS model manifest"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release from the refreshed manifest
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main

      - name: Upload update log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-tts-models-log
          path: update-tts-models.log
          retention-days: 30
          if-no-files-found: ignore
