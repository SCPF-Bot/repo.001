name: Download Item Portraits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/src/main/assets/items.json"
      - "scripts/download_item_portraits.py"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download item portraits
        run: python3 scripts/download_item_portraits.py

      - name: Commit downloaded portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/src/main/assets/items/ app/src/main/assets/items.json

          if git diff --cached --quiet; then
            echo "No new portraits to commit."
          else
            git commit -m "Update item portraits"
            git push
          fi
